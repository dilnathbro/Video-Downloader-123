<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiL Downloader - Facebook Video Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0f2027, #1e293b);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .brand-title {
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899, #3b82f6);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: animatedGlow 4s linear infinite;
    }
    @keyframes animatedGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .btn-gradient {
      background: linear-gradient(135deg, #1877f2 0%, #3b82f6 100%);
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      background: linear-gradient(135deg, #166fe5 0%, #2563eb 100%);
      transform: translateY(-2px);
    }
    .store-card {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.15), rgba(139, 92, 246, 0.15));
      border: 1px solid rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between font-sans relative overflow-x-hidden">

  <!-- Header -->
  <header class="py-6 text-center border-b border-slate-800/60 relative z-10">
    <div class="flex items-center justify-center gap-3 mb-2">
      <div class="p-3 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl shadow-lg animate-pulse">
        <i class="fa-brands fa-facebook-f text-2xl text-white"></i>
      </div>
      <h1 class="text-4xl md:text-5xl font-extrabold brand-title">DiL Downloader</h1>
    </div>
    <p class="text-slate-400 text-sm font-medium">Download Facebook Videos & Reels Easily</p>
  </header>

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto px-4 py-8 w-full relative z-10 space-y-8">
    
    <!-- Input Box -->
    <div class="glass-card p-6 md:p-8 rounded-3xl relative">
      <div class="flex justify-between items-center mb-3">
        <label for="videoUrl" class="text-sm font-semibold text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-link text-blue-400"></i> Paste Facebook Link Below:
        </label>
        <button onclick="pasteFromClipboard()" class="text-xs bg-slate-800 hover:bg-slate-700 text-blue-300 px-3 py-1.5 rounded-xl border border-blue-500/30 transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-regular fa-clipboard"></i> Paste Link
        </button>
      </div>

      <div class="flex flex-col gap-3">
        <div class="relative w-full">
          <input 
            type="url" 
            id="videoUrl" 
            placeholder="Paste Facebook Video or Reels Link..." 
            class="w-full pl-5 pr-12 py-4 bg-slate-900/80 border border-slate-700/80 rounded-2xl focus:outline-none focus:border-blue-500 text-white placeholder-slate-500 transition"
          />
          <button onclick="clearInput()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <button 
          onclick="fetchVideo()" 
          id="downloadBtn" 
          class="btn-gradient text-white font-bold px-8 py-4 rounded-2xl flex items-center justify-center gap-2 cursor-pointer shadow-lg active:scale-95"
        >
          <span>Fetch Facebook Video</span>
          <i class="fa-solid fa-download"></i>
        </button>
      </div>

      <p id="errorMessage" class="text-red-400 text-xs mt-4 hidden text-center bg-red-950/50 p-3 rounded-xl border border-red-800/50"></p>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="hidden text-center my-6">
      <div class="w-12 h-12 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin inline-block"></div>
      <p class="text-slate-400 text-sm mt-3 animate-pulse">Processing via RapidAPI Engine...</p>
    </div>

    <!-- Download Result Box -->
    <div id="resultCard" class="hidden glass-card p-6 rounded-3xl text-center border border-blue-500/30 space-y-4">
      <h2 class="text-base font-bold text-slate-100 flex items-center justify-center gap-2">
        <i class="fa-solid fa-circle-check text-green-400"></i> Download Ready:
      </h2>
      
      <div id="qualityOptions" class="flex flex-col gap-3 max-w-md mx-auto pt-2"></div>
    </div>

    <!-- MND Mobile Store Banner -->
    <div class="glass-card store-card p-6 rounded-3xl flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4 text-center md:text-left">
        <div class="p-4 bg-pink-500/20 text-pink-400 rounded-2xl text-3xl">
          <i class="fa-solid fa-mobile-screen-button"></i>
        </div>
        <div>
          <h3 class="font-bold text-lg text-slate-100">Looking for Mobile Accessories & Gadgets?</h3>
          <p class="text-xs text-slate-400">Visit MND Mobile Store for the best tech deals in Sri Lanka!</p>
        </div>
      </div>
      <a 
        href="https://mnd-mobile.netlify.app" 
        target="_blank" 
        class="bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white text-sm font-bold py-3 px-6 rounded-2xl transition shadow-lg flex items-center gap-2 whitespace-nowrap"
      >
        <span>Visit MND Mobile</span>
        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
      </a>
    </div>

  </main>

  <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-800/50 mt-10">
    Designed for <span class="text-blue-400 font-semibold">DiL Downloader</span> &copy; 2026
  </footer>

  <script>
    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById('videoUrl').value = text;
      } catch (err) {
        alert("කරුණාකර Link එක Paste කිරීමට Permission ලබා දෙන්න.");
      }
    }

    function clearInput() {
      document.getElementById('videoUrl').value = '';
    }

    async function fetchVideo() {
      const urlInput = document.getElementById('videoUrl').value.trim();
      const errorMsg = document.getElementById('errorMessage');
      const loading = document.getElementById('loading');
      const resultCard = document.getElementById('resultCard');
      const qualityOptions = document.getElementById('qualityOptions');

      errorMsg.classList.add('hidden');
      resultCard.classList.add('hidden');
      qualityOptions.innerHTML = '';

      if (!urlInput) {
        errorMsg.textContent = "කරුණාකර Facebook Video / Reels Link එකක් ඇතුළත් කරන්න.";
        errorMsg.classList.remove('hidden');
        return;
      }

      loading.classList.remove('hidden');

      try {
        const res = await fetch(`/api/download?url=${encodeURIComponent(urlInput)}`);
        const data = await res.json();

        if (res.ok && data.downloads) {
          data.downloads.forEach(item => {
            const btn = document.createElement('a');
            btn.href = item.url;
            btn.target = '_blank';
            btn.download = 'facebook-video.mp4';
            btn.className = 'bg-slate-800 hover:bg-slate-700 border border-blue-500/30 text-white font-semibold py-3.5 px-5 rounded-2xl flex items-center justify-between transition shadow active:scale-95';
            btn.innerHTML = `
              <span class="flex items-center gap-2.5 text-sm truncate pr-2">
                <i class="fa-brands fa-facebook text-blue-400"></i> ${item.quality}
              </span>
              <span class="text-xs bg-blue-600/30 border border-blue-500/40 px-3 py-1.5 rounded-xl text-blue-300 font-bold whitespace-nowrap">
                Download <i class="fa-solid fa-download text-xs ml-1"></i>
              </span>
            `;
            qualityOptions.appendChild(btn);
          });
          resultCard.classList.remove('hidden');
        } else {
          errorMsg.textContent = data.error || "මෙම වීඩියෝව Extract කිරීමට නොහැකි විය.";
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = "Server සම්බන්ධතාවයේ දෝෂයක් ඇත. කරුණාකර නැවත උත්සාහ කරන්න.";
        errorMsg.classList.remove('hidden');
      }

      loading.classList.add('hidden');
    }
  </script>
</body>
</html>
